name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Unit tests
        run: pytest -q

      - name: Syntax check
        run: python -m py_compile gigachat_proxy.py

      - name: Prepare CI-only secret placeholders
        run: |
          printf '%s\n' 'GIGACHAT_CREDENTIALS=ci-placeholder' > .env

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: gigachat-proxy:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify bundled CA certificate
        run: |
          expected="$(sha256sum certs/gigachat-ca-bundle.pem | cut -d' ' -f1)"
          actual="$(docker run --rm --entrypoint sha256sum gigachat-proxy:ci /run/gigachat/certs/gigachat-ca-bundle.pem | cut -d' ' -f1)"
          test "$expected" = "$actual"

  publish-docker:
    name: Publish Docker image
    needs: test-and-build
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/gigachat-openai-proxy
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published image digest
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r image; do
            [ -z "$image" ] || docker buildx imagetools inspect "$image"
          done <<< "$IMAGE_TAGS"
