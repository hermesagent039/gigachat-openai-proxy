services:
  gigachat-proxy:
    build: .
    user: "0:0"
    ports:
      - "${GIGACHAT_PROXY_PORT:-18786}:8766"
    env_file:
      - ./secrets/gigachat.env
    environment:
      GIGACHAT_PROXY_HOME: /run/gigachat
    volumes:
      - ./secrets/gigachat.env:/run/gigachat/.env:ro
    restart: unless-stopped
